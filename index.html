<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitoreo Tobaru s.a.s</title>
  <link rel="icon" type="image/png" href="imagenes/marca.png">
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header class="hdr">
    <div class="hdr-l">
      <!-- Logo desde carpeta imagenes/ en el mismo repositorio -->
      <img src="imagenes/marca.png" alt="GobIA" class="logo-img"
        onerror="this.style.display='none';document.getElementById('logo-fallback').style.display='flex';">
      <div id="logo-fallback"
        style="display:none;width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:8px;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;">
        G</div>
      <div class="sep"></div>
      <span class="subtitle">Monitor de Contratación Pública · Colombia</span>
    </div>
    <div class="hdr-r">
      <span id="api-agent"
        style="font-size:10px;color:var(--text3);background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:3px 9px;display:none;"></span>
      <div class="api-ok" id="api-status">
        <div class="dot-live"></div>Conectando…
      </div>
      <div class="ts" id="ts">—</div>
    </div>
  </header>

  <div class="wrap" id="app">
    <div class="loading">
      <div class="spinner"></div>Cargando datos de la API GobIA…
    </div>
  </div>

  <footer class="ftr">
    <span>tobaru · Análisis de contratación pública Colombia · Datos reales de <a href="https://www.datos.gov.co"
        target="_blank">datos.gov.co</a></span>
    <span>API: <a href="https://gobiapi.tobaru.xyz/api/leaderboard/gobia" target="_blank">gobiapi.tobaru.xyz</a></span>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <script>
    const API = 'https://gobiapi.tobaru.xyz/api/leaderboard/gobia';
    const GEO_URLS = [
      'https://gist.githubusercontent.com/john-guerra/43c7656821069d00dcbc/raw/be6a6e239cd5b5b803c6e7c2ec405b793a9064dd/Colombia.geo.json',
      'https://raw.githubusercontent.com/marcovega/colombia-json/master/colombia.min.json'
    ];

    // ── UTILS ─────────────────────────────────────────────
    function fmtBig(s) {
      const n = parseFloat((s || '0').toString().replace(/[$,]/g, ''));
      if (isNaN(n) || n === 0) return s || '—';
      if (n >= 1e12) return '$' + (n / 1e12).toFixed(2) + 'B';
      if (n >= 1e9) return '$' + (n / 1e9).toFixed(1) + 'MM';
      if (n >= 1e6) return '$' + (n / 1e6).toFixed(1) + 'M';
      if (n >= 1e3) return '$' + (n / 1e3).toFixed(0) + 'K';
      return s || '—';
    }
    function tc(s, n) { if (!s) return '—'; return s.length > n ? s.slice(0, n) + '…' : s; }
    function sc(v, m = 't') {
      const n = parseFloat(v);
      if (m === 't') return n >= 65 ? 'var(--green)' : n >= 45 ? 'var(--blue)' : n >= 25 ? 'var(--amber)' : 'var(--red)';
      if (m === 'bg') return n >= 65 ? 'var(--green-bg)' : n >= 45 ? 'var(--blue-bg)' : n >= 25 ? 'var(--amber-bg)' : 'var(--red-bg)';
      return n >= 65 ? 'var(--green-b)' : n >= 45 ? 'var(--blue-b)' : n >= 25 ? 'var(--amber-b)' : 'var(--red-b)';
    }
    function oc(p, m = 't') {
      const n = parseFloat(p);
      if (m === 't') return n >= 80 ? 'var(--red)' : n >= 50 ? 'var(--amber)' : n >= 25 ? 'var(--blue)' : 'var(--green)';
      if (m === 'bg') return n >= 80 ? 'var(--red-bg)' : n >= 50 ? 'var(--amber-bg)' : n >= 25 ? 'var(--blue-bg)' : 'var(--green-bg)';
      return n >= 80 ? 'var(--red-b)' : n >= 50 ? 'var(--amber-b)' : n >= 25 ? 'var(--blue-b)' : 'var(--green-b)';
    }
    const PALETTES = [
      { bg: 'var(--red-bg)', tc: 'var(--red)', b: 'var(--red-b)' },
      { bg: 'var(--amber-bg)', tc: 'var(--amber)', b: 'var(--amber-b)' },
      { bg: 'var(--blue-bg)', tc: 'var(--blue)', b: 'var(--blue-b)' },
      { bg: 'var(--green-bg)', tc: 'var(--green)', b: 'var(--green-b)' },
      { bg: 'var(--teal-bg)', tc: 'var(--teal)', b: 'var(--teal-b)' },
    ];
    function pal(i) { return PALETTES[i % PALETTES.length]; }
    function rnum(i) {
      const p = pal(i);
      return `<div class="rnum" style="background:${p.bg};color:${p.tc};border:1px solid ${p.b};">${i + 1}</div>`;
    }

    // ── STATE ──────────────────────────────────────────────
    let LB = {}, ALL = [], PD = {};
    let fNivel = '', fDepto = '', selCase = null, activeTab = 0, sortK = 'corruption', sortD = -1, srchQ = '';

    function processData(data) {
      // La API retorna { agente, descripcion, resultados: [...] }
      // o el formato antiguo { agente, leaderboard: { mayor_indice_corrupcion, ... } }
      const resultados = data.resultados || [];
      const leaderboardBase = data.leaderboard || {};

      // Extraer contratos de resultados[] si no hay leaderboard clásico
      const contractsFromResultados = resultados.map(r => r.contrato).filter(Boolean);

      // Construir ALL: primero del leaderboard clásico, luego de resultados
      ALL = []; PD = {};
      const seen = new Set();
      const classicLists = [
        ...(leaderboardBase.mayor_indice_corrupcion || []),
        ...(leaderboardBase.contratos_recomendados || []),
        ...(leaderboardBase.mejor_confiabilidad_precio || []),
        ...(leaderboardBase.mejores_contratos_generales || []),
      ];
      [...classicLists, ...contractsFromResultados].forEach(c => {
        const id = c['ID Contrato'];
        if (id && !seen.has(id)) { seen.add(id); ALL.push(c); }
      });

      // Construir LB: si existe el leaderboard clásico úsalo, si no, sintetízalo desde resultados
      if (leaderboardBase.mayor_indice_corrupcion) {
        LB = leaderboardBase;
      } else {
        // Sintetizar categorías desde los datos de resultados
        const sorted = [...ALL].sort((a, b) => b.porcentaje_corrupcion_estimado - a.porcentaje_corrupcion_estimado);
        const sortedRec = [...ALL].sort((a, b) => (b.score_recomendacion || 0) - (a.score_recomendacion || 0));
        const sortedConf = [...ALL].sort((a, b) => (b.score_confiabilidad_precio || 0) - (a.score_confiabilidad_precio || 0));
        const sortedGen = [...ALL].sort((a, b) => (b.score_general || 0) - (a.score_general || 0));
        LB = {
          mayor_indice_corrupcion: sorted,
          contratos_recomendados: sortedRec,
          mejor_confiabilidad_precio: sortedConf,
          mejores_contratos_generales: sortedGen,
          // Sintetizar contratistas desde los contratos disponibles
          contratistas_mejor_historial: ALL.reduce((acc, c) => {
            const p = c['Proveedor Adjudicado'] || 'Desconocido';
            let entry = acc.find(e => e['Proveedor Adjudicado'] === p);
            if (!entry) {
              entry = {
                'Proveedor Adjudicado': p, contratos: 0, departamentos: 0, entidades: 0,
                opacidad_promedio: 0, valor_total: 0, score_historial: c.score_historial || 50,
                _deptos: new Set(), _ents: new Set(), _opacSum: 0
              };
              acc.push(entry);
            }
            entry.contratos++;
            entry._deptos.add(c.Departamento);
            entry._ents.add(c['Nombre Entidad']);
            entry._opacSum += (c.porcentaje_corrupcion_estimado || 0);
            entry.valor_total += parseFloat((c['Valor del Contrato'] || '0').replace(/[$,]/g, ''));
            return acc;
          }, []).map(e => ({ ...e, departamentos: e._deptos.size, entidades: e._ents.size, opacidad_promedio: e._opacSum / e.contratos }))
            .sort((a, b) => (b.score_historial || 0) - (a.score_historial || 0))
        };
      }

      // Construir mapa de departamentos
      ALL.forEach(c => {
        const d = c.Departamento;
        if (!d) return;
        if (!PD[d]) PD[d] = { n: 0, opacSum: 0, maxOpac: 0, valor: 0 };
        PD[d].n++; PD[d].opacSum += (c.porcentaje_corrupcion_estimado || 0);
        PD[d].valor += parseFloat((c['Valor del Contrato'] || '0').replace(/[$,]/g, ''));
        if ((c.porcentaje_corrupcion_estimado || 0) > PD[d].maxOpac) PD[d].maxOpac = c.porcentaje_corrupcion_estimado;
      });

      // Mostrar agente en el header
      if (data.agente) {
        const el = document.getElementById('api-agent');
        if (el) el.textContent = data.agente;
      }
    }

    // ── KPIs ──────────────────────────────────────────────
    function buildKPIs() {
      const mic = (LB.mayor_indice_corrupcion || [])[0] || null;
      const cr = (LB.contratos_recomendados || [])[0] || null;
      const cmh = (LB.contratistas_mejor_historial || [])[0] || null;
      const mcp = (LB.mejor_confiabilidad_precio || [])[0] || null;
      const mcg = (LB.mejores_contratos_generales || [])[0] || null;
      const kpis = [
        { icon: '⚠️', bg: 'var(--red-bg)', label: 'Mayor opacidad', col: 'var(--red)', val: mic ? mic.porcentaje_corrupcion_estimado + '%' : '—', sub: mic ? tc(mic['ID Contrato'], 24) : 'Sin datos' },
        { icon: '✅', bg: 'var(--green-bg)', label: 'Top recomendado', col: 'var(--green)', val: cr ? (cr.score_recomendacion || 0).toFixed(1) : '—', sub: cr ? tc(cr['ID Contrato'], 24) : 'Sin datos' },
        { icon: '🏆', bg: 'var(--blue-bg)', label: 'Mejor contratista', col: 'var(--blue)', val: cmh ? (cmh.score_historial || 0).toFixed(1) : '—', sub: cmh ? tc(cmh['Proveedor Adjudicado'], 24) : 'Sin datos' },
        { icon: '💰', bg: 'var(--teal-bg)', label: 'Mejor conf./precio', col: 'var(--teal)', val: mcp ? (mcp.score_confiabilidad_precio || 0).toFixed(1) : '—', sub: mcp ? tc(mcp['ID Contrato'], 24) : 'Sin datos' },
        { icon: '⭐', bg: 'var(--purple-bg)', label: 'Mejor score general', col: 'var(--purple)', val: mcg ? (mcg.score_general || 0).toFixed(1) : '—', sub: mcg ? tc(mcg['ID Contrato'], 24) : 'Sin datos' },
      ];
      return `
  <div class="slabel"><div class="si" style="background:var(--accent-bg)">📊</div><span class="st">Resumen ejecutivo</span><span class="pbadge" style="margin-left:4px;">${ALL.length} contratos · ${Object.keys(PD).length} departamentos</span></div>
  <div class="row row-5" style="margin-bottom:16px;">
    ${kpis.map(k => `<div class="panel kpi-card"><div class="kpi"><div class="kpi-icon" style="background:${k.bg}">${k.icon}</div><div style="min-width:0;"><div class="kpi-label">${k.label}</div><div class="kpi-val" style="color:${k.col}">${k.val}</div><div class="kpi-sub">${k.sub}</div></div></div></div>`).join('')}
  </div>`;
    }

    // ── MAP ────────────────────────────────────────────────
    function normD(s) {
      if (!s) return '';
      const c = s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/\s+/g, ' ').trim();
      const al = { 'ARCHIPIELAGO DE SAN ANDRES PROVIDENCIA Y SANTA CATALINA': 'SAN ANDRES', 'NORTE SANTANDER': 'NORTE DE SANTANDER', 'VALLE': 'VALLE DEL CAUCA', 'BOGOTA D C': 'CUNDINAMARCA', 'BOGOTA, D.C.': 'CUNDINAMARCA', 'DISTRITO CAPITAL DE BOGOTA': 'CUNDINAMARCA', 'GUAJIRA': 'LA GUAJIRA' };
      return al[c] || c;
    }
    function featN(f) { const p = f.properties || {}; return p.NOMBRE_DPT || p.NOMBRE || p.DPTO_CNMBR || p.NAME_1 || p.departamento || p.Departamento || p.NAME || ''; }

    async function initMap() {
      const svg = d3.select('#col-map');
      const cont = document.getElementById('map-container');
      const W = cont.clientWidth || 560, H = 400;
      svg.selectAll('*').remove();
      svg.attr('viewBox', `0 0 ${W} ${H}`);
      const tt = document.getElementById('mtt');
      const risk = {};
      Object.entries(PD).forEach(([d, s]) => { risk[normD(d)] = s; });
      const maxO = Math.max(...Object.values(risk).map(d => d.maxOpac), 1);
      // Paleta oscura morada→roja
      const col = d3.scaleSequential([0, maxO], d3.interpolateRgb('#3b1f6e', '#f87171'));
      let geo = null;
      for (const url of GEO_URLS) {
        try {
          const raw = await d3.json(url);
          if (raw && Array.isArray(raw.features) && raw.features.length) { geo = raw; break; }
          if (raw && raw.type === 'Topology') { const k = Object.keys(raw.objects)[0]; const g = topojson.feature(raw, raw.objects[k]); if (g && g.features && g.features.length) { geo = g; break; } }
        } catch (e) { console.warn('GeoJSON:', url, e); }
      }
      if (!geo) { document.getElementById('map-badge').textContent = 'Sin geometría'; return; }
      document.getElementById('map-badge').textContent = 'Colombia · geometría real';
      const proj = d3.geoMercator().fitSize([W, H], geo);
      const path = d3.geoPath(proj);
      svg.selectAll('path').data(geo.features).enter().append('path')
        .attr('d', path)
        .attr('fill', f => { const d = normD(featN(f)); const s = risk[d]; return (!s || s.n === 0) ? '#1f2333' : col(s.maxOpac); })
        .attr('stroke', '#0d0f14').attr('stroke-width', 0.7).attr('cursor', 'pointer').style('transition', 'opacity .15s')
        .on('mouseover', function (e, f) {
          d3.select(this).attr('opacity', 0.75);
          const raw = featN(f), d = normD(raw), s = risk[d] || { n: 0, opacSum: 0, maxOpac: 0, valor: 0 };
          const avg = s.n > 0 ? (s.opacSum / s.n).toFixed(0) : 0;
          tt.style.display = 'block';
          document.getElementById('tt-name').textContent = raw || d;
          document.getElementById('tt-n').textContent = s.n;
          document.getElementById('tt-avg').textContent = avg + '%';
          document.getElementById('tt-max').textContent = s.maxOpac + '%';
          document.getElementById('tt-val').textContent = fmtBig(s.valor + '');
        })
        .on('mousemove', function (e) { const r = cont.getBoundingClientRect(); tt.style.left = (e.clientX - r.left + 12) + 'px'; tt.style.top = (e.clientY - r.top - 10) + 'px'; })
        .on('mouseout', function () { d3.select(this).attr('opacity', 1); tt.style.display = 'none'; })
        .on('click', function (e, f) {
          const d = normD(featN(f));
          const match = Object.keys(PD).find(k => normD(k) === d);
          if (match) { fDepto = match; const sel = document.getElementById('fd'); if (sel) { sel.value = match; } renderCases(); }
        });
    }

    // ── MAP + CASES SECTION ────────────────────────────────
    function buildMapSection() {
      const deptos = [...new Set(ALL.map(c => c.Departamento))].sort();
      return `
  <div class="slabel" style="margin-top:16px;"><div class="si" style="background:var(--blue-bg)">🗺️</div><span class="st">Mapa de riesgo · Casos detectados</span></div>
  <div class="row row-map">
    <div class="panel">
      <div class="ph"><div class="pt">🗺️ Mapa de riesgo por departamento</div><span class="pbadge" id="map-badge">Cargando…</span></div>
      <div id="map-container"><svg id="col-map"></svg>
        <div class="mtt" id="mtt">
          <div class="mtt-name" id="tt-name"></div>
          <div class="mtt-row"><span>Contratos</span><span class="mtt-val" id="tt-n"></span></div>
          <div class="mtt-row"><span>Opacidad prom.</span><span class="mtt-val" id="tt-avg"></span></div>
          <div class="mtt-row"><span>Opacidad máx.</span><span class="mtt-val" id="tt-max"></span></div>
          <div class="mtt-row"><span>Valor total</span><span class="mtt-val" id="tt-val"></span></div>
        </div>
      </div>
      <div class="map-leg">
        <span class="leg-t">Bajo</span><div class="leg-g"></div><span class="leg-t">Alto</span>
        <span class="leg-t" style="margin-left:10px;">Índice de opacidad — clic en un dpto. para filtrar</span>
      </div>
    </div>
    <div class="panel" style="display:flex;flex-direction:column;max-height:470px;">
      <div class="ph"><div class="pt">⚠️ Casos detectados</div><span class="pbadge" id="cases-badge">—</span></div>
      <div class="filter-bar">
        <select id="fn" onchange="fNivel=this.value;renderCases()">
          <option value="">Todos los niveles</option>
          <option value="alta">Alta (≥80%)</option>
          <option value="media">Media (50-79%)</option>
          <option value="baja">Baja (&lt;50%)</option>
        </select>
        <select id="fd" onchange="fDepto=this.value;renderCases()">
          <option value="">Todos los dptos.</option>
          ${deptos.map(d => `<option value="${d}">${d}</option>`).join('')}
        </select>
      </div>
      <div class="cases-list" id="cases-list" style="flex:1;overflow-y:auto;"></div>
    </div>
  </div>`;
    }

    // ── DETAIL ─────────────────────────────────────────────
    function buildDetailSection() {
      return `<div class="detail" id="detail-panel">
    <div class="d-head">
      <div><div class="d-id" id="d-id"></div><div class="d-sub" id="d-sub"></div></div>
      <button class="d-close" onclick="closeDetail()">✕</button>
    </div>
    <div class="d-obj" id="d-obj"></div>
    <div class="d-grid" id="d-grid"></div>
    <div id="d-alertas"></div>
    <div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;margin-top:10px;">Score de opacidad</div>
    <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
      <span id="d-stxt" style="font-family:'DM Mono',monospace;font-size:12px;"></span>
      <span style="font-size:10px;color:var(--text3);">/100</span>
    </div>
    <div class="dbar-t"><div class="dbar-f" id="d-bar" style="width:0%;"></div></div>
    <div style="margin-top:10px;"><a id="d-url" href="#" target="_blank" style="font-size:11px;color:var(--accent2);text-decoration:none;">Ver en SECOP II →</a></div>
  </div>`;
    }

    // ── RENDER CASES ───────────────────────────────────────
    function renderCases() {
      let list = [...ALL];
      if (fNivel === 'alta') list = list.filter(c => c.porcentaje_corrupcion_estimado >= 80);
      else if (fNivel === 'media') list = list.filter(c => c.porcentaje_corrupcion_estimado >= 50 && c.porcentaje_corrupcion_estimado < 80);
      else if (fNivel === 'baja') list = list.filter(c => c.porcentaje_corrupcion_estimado < 50);
      if (fDepto) list = list.filter(c => c.Departamento === fDepto);
      list.sort((a, b) => b.porcentaje_corrupcion_estimado - a.porcentaje_corrupcion_estimado);
      document.getElementById('cases-badge').textContent = list.length + ' casos';
      document.getElementById('cases-list').innerHTML = list.slice(0, 50).map((c) => {
        const pct = c.porcentaje_corrupcion_estimado, isSel = selCase === c['ID Contrato'];
        const rcStyle = pct >= 80 ? `border-color:var(--red);color:var(--red);background:var(--red-bg)` : pct >= 50 ? `border-color:var(--amber);color:var(--amber);background:var(--amber-bg)` : `border-color:var(--green);color:var(--green);background:var(--green-bg)`;
        return `<div class="case-item${isSel ? ' sel' : ''}" onclick="selectCase('${c['ID Contrato']}')">
      <div class="ring" style="${rcStyle}">${Math.round(pct)}</div>
      <div style="min-width:0;">
        <div class="c-id">${c['ID Contrato']}</div>
        <div class="c-ent">${tc(c['Nombre Entidad'], 36)}</div>
        <div class="c-dep">${c.Departamento} · ${c['Tipo de Contrato']}</div>
      </div>
      <div class="c-pct">
        <div class="c-pv" style="color:${oc(pct)}">${pct}%</div>
        <div class="c-pl">Opacidad</div>
        <div class="c-vl">${fmtBig(c['Valor del Contrato'])}</div>
      </div>
    </div>`;
      }).join('');
    }

    function selectCase(id) {
      selCase = id; const c = ALL.find(x => x['ID Contrato'] === id); if (!c) return;
      renderCases();
      const panel = document.getElementById('detail-panel'); panel.classList.add('on');
      document.getElementById('d-id').textContent = c['ID Contrato'];
      document.getElementById('d-sub').textContent = `Opacidad: ${c.porcentaje_corrupcion_estimado}% · ${c['Tipo de Contrato']} · ${c.Departamento}`;
      document.getElementById('d-obj').textContent = c['Objeto del Contrato'] || '—';
      document.getElementById('d-grid').innerHTML = `
    <div class="d-item"><label>Entidad</label><span>${tc(c['Nombre Entidad'], 30)}</span></div>
    <div class="d-item"><label>Proveedor</label><span>${tc(c['Proveedor Adjudicado'], 30)}</span></div>
    <div class="d-item"><label>Valor</label><span>${fmtBig(c['Valor del Contrato'])}</span></div>
    <div class="d-item"><label>Modalidad</label><span style="font-size:10px;">${tc(c['Modalidad de Contratacion'], 28)}</span></div>`;
      // Mostrar alertas del contrato si existen
      const alertasEl = document.getElementById('d-alertas');
      if (alertasEl) {
        if (c.alertas) {
          const tags = c.alertas.split(',').map(a => `<span class="tag ta" style="font-size:10px;padding:2px 8px;">${a.trim()}</span>`).join('');
          alertasEl.innerHTML = `<div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;margin-top:8px;">Alertas detectadas</div><div style="display:flex;flex-wrap:wrap;gap:4px;">${tags}</div>`;
        } else {
          alertasEl.innerHTML = '';
        }
      }

    function doSort(k) { if (sortK === k) sortD *= -1; else { sortK = k; sortD = -1; } renderTable(); }
    function renderTable() {
      const q = (srchQ || '').toLowerCase();
      let list = ALL.filter(c => !q || (c['ID Contrato'] || '').toLowerCase().includes(q) || (c['Nombre Entidad'] || '').toLowerCase().includes(q) || (c.Departamento || '').toLowerCase().includes(q) || (c['Proveedor Adjudicado'] || '').toLowerCase().includes(q));
      list = [...list].sort((a, b) => {
        const av = sortK === 'valor' ? parseFloat((a['Valor del Contrato'] || '0').replace(/[$,]/g, '')) : sortK === 'id' ? a['ID Contrato'] : a.porcentaje_corrupcion_estimado;
        const bv = sortK === 'valor' ? parseFloat((b['Valor del Contrato'] || '0').replace(/[$,]/g, '')) : sortK === 'id' ? b['ID Contrato'] : b.porcentaje_corrupcion_estimado;
        return av > bv ? sortD : av < bv ? -sortD : 0;
      });
      document.getElementById('tbl-count').textContent = list.length + ' resultados';
      document.getElementById('tbl-body').innerHTML = list.slice(0, 80).map(c => {

    // ── INIT ───────────────────────────────────────────────
    async function init() {
      document.getElementById('ts').textContent = new Date().toLocaleTimeString('es-CO');
      try {
        const res = await fetch(API, { method: 'GET', mode: 'cors', headers: { 'Accept': 'application/json' } });
        if (!res.ok) throw new Error('HTTP ' + res.status + ' — ' + res.statusText);
        const data = await res.json();
        // Acepta: { leaderboard:{...} } o { resultados:[...] } o { mayor_indice_corrupcion:[...] }
        const hasData = data && (data.leaderboard || data.resultados || data.mayor_indice_corrupcion);
        if (!hasData) {
          throw new Error('Estructura de datos inesperada en la respuesta');
        }
        processData(data);
        document.getElementById('api-status').innerHTML = '<div class="dot-live"></div>API activa';
        document.getElementById('ts').textContent = 'Act. ' + new Date().toLocaleTimeString('es-CO');
        // Mostrar nombre del agente
        const agEl = document.getElementById('api-agent');
        if (agEl) { agEl.style.display = 'block'; }
        const resultados = data.resultados || [];
        document.getElementById('app').innerHTML =
          buildKPIs() +
          buildMapSection() +
          buildDetailSection() +
          buildCharts() +
          buildLeaderboard(resultados) +
          buildTabs() +
          buildFullTable();
        renderCases();
        renderTable();
        renderTab();
        initMap();
      } catch (err) {
        document.getElementById('api-status').innerHTML = '<span style="color:var(--red)">⚠ Sin conexión</span>';
        document.getElementById('app').innerHTML = `<div class="err">
      <div style="font-size:22px;margin-bottom:7px;">⚠️</div>
      <div style="font-weight:600;margin-bottom:5px;">Error al conectar con la API</div>
      <div style="font-size:11px;opacity:.8;">${err.message}</div>
      <button onclick="init()" style="margin-top:12px;background:var(--accent);color:#fff;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;">Reintentar</button>
    </div>`;
      }
    }
    init();
  </script>

  <!-- ── CHATBOT WIDGET ─────────────────────────────────── -->
  <button id="chat-fab" aria-label="Abrir GobIA Chat" onclick="chatToggle()">
    <img src="imagenes/marca.png" alt="GobIA"
      onerror="this.style.display='none';document.getElementById('chat-fab-fallback').style.display='flex';">
    <span id="chat-fab-fallback" class="chat-fab-fallback" style="display:none;">🤖</span>
    <span class="chat-fab-badge"></span>
  </button>

  <div id="chat-window" role="dialog" aria-label="GobIA Auditor Chat">
    <!-- Header -->
    <div class="chat-header">
      <img src="imagenes/marca.png" alt="GobIA" class="chat-header-logo"
        onerror="this.style.display='none';document.getElementById('chat-logo-fallback').style.display='flex';">
      <div id="chat-logo-fallback" class="chat-header-logo-fallback" style="display:none;">G</div>
      <div class="chat-header-info">
        <div class="chat-header-title">🤖 GobIA Auditor</div>
        <div class="chat-header-sub">Análisis de contratación pública · Colombia</div>
      </div>
      <button class="chat-close-btn" onclick="chatToggle()" aria-label="Cerrar">✕</button>
    </div>
    <!-- Messages -->
    <div class="chat-messages" id="chat-messages"></div>
    <!-- Input -->
    <div class="chat-input-row">
      <textarea id="chat-input" rows="1" placeholder="Escribe tu pregunta…" onkeydown="chatKeyDown(event)"
        oninput="chatAutoResize(this)"></textarea>
      <button id="chat-send-btn" onclick="chatSend()" aria-label="Enviar">
        <svg viewBox="0 0 24 24">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
        </svg>
      </button>
    </div>
    <!-- Ping status bar -->
    <div class="chat-ping-bar">
      <span class="chat-ping-dot checking" id="chat-ping-dot"></span>
      <span id="chat-ping-txt">Verificando conexión…</span>
    </div>
  </div>

  <script>
    // ── CHATBOT CONFIG ────────────────────────────────────
    const CHAT_BASE = 'https://gobiapi.tobaru.xyz';
    const CHAT_URL = CHAT_BASE + '/api/chat';
    const PING_URL = CHAT_BASE + '/api/ping';

    let chatOpen = false;
    let chatBusy = false;
    let pingOk = false;

    // ── TOGGLE ────────────────────────────────────────────
    function chatToggle() {
      chatOpen = !chatOpen;
      const win = document.getElementById('chat-window');
      win.classList.toggle('open', chatOpen);
      if (chatOpen) {
        // First open: add welcome message + ping
        const msgs = document.getElementById('chat-messages');
        if (!msgs.children.length) {
          chatAddBubble('bot', '¡Hola! Soy <strong>GobIA Auditor</strong>, tu asistente de análisis de contratación pública en Colombia. 🇨🇴<br><br>Puedes preguntarme sobre contratos, indicadores de opacidad, entidades contratantes o cualquier dato del leaderboard.');
          chatPing();
        }
        setTimeout(() => document.getElementById('chat-input').focus(), 220);
      }
    }

    // ── PING (mirrors Python: GET /api/ping) ─────────────
    async function chatPing() {
      const dot = document.getElementById('chat-ping-dot');
      const txt = document.getElementById('chat-ping-txt');
      dot.className = 'chat-ping-dot checking';
      txt.textContent = 'Verificando conexión…';
      try {
        const r = await fetch(PING_URL, { method: 'GET', mode: 'cors' });
        if (r.ok) {
          pingOk = true;
          dot.className = 'chat-ping-dot';
          txt.textContent = 'API activa · gobiapi.tobaru.xyz';
        } else {
          throw new Error('HTTP ' + r.status);
        }
      } catch (e) {
        pingOk = false;
        dot.className = 'chat-ping-dot error';
        txt.textContent = 'Sin conexión con la API (' + e.message + ')';
      }
    }

    // ── SEND (mirrors Python: GET ping → POST /api/chat) ──
    async function chatSend() {
      if (chatBusy) return;
      const input = document.getElementById('chat-input');
      const mensaje = (input.value || '').trim();
      if (!mensaje) return;

      // Exit words (mirrors Python)
      if (['salir', 'exit', 'quit'].includes(mensaje.toLowerCase())) {
        chatToggle(); return;
      }

      input.value = '';
      chatAutoResize(input);
      chatAddBubble('user', escHtml(mensaje));
      chatBusy = true;
      document.getElementById('chat-send-btn').disabled = true;

      // Show typing indicator
      const typingId = chatAddTyping();

      try {
        // Step 1: Ping (mirrors Python)
        await chatPing();

        // Step 2: POST /api/chat with {"mensaje": mensaje}
        const resp = await fetch(CHAT_URL, {
          method: 'POST',
          mode: 'cors',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({ mensaje })
        });

        chatRemoveTyping(typingId);

        if (!resp.ok) {
          const errTxt = await resp.text().catch(() => '');
          chatAddBubble('error', `⚠️ Error ${resp.status}: ${escHtml(errTxt.slice(0, 200))}`);
        } else {
          const data = await resp.json();
          // Mirrors Python: data.get("respuesta", "Sin respuesta")
          const respuesta = data.respuesta || 'Sin respuesta';
          chatAddBubble('bot', escHtml(respuesta).replace(/\n/g, '<br>'));
        }

      } catch (e) {
        chatRemoveTyping(typingId);
        chatAddBubble('error', '⚠️ Error de conexión: ' + escHtml(e.message));
      }

      chatBusy = false;
      document.getElementById('chat-send-btn').disabled = false;
      input.focus();
    }

    // ── HELPERS ───────────────────────────────────────────
    function chatAddBubble(type, html) {
      const msgs = document.getElementById('chat-messages');
      const div = document.createElement('div');
      div.className = 'chat-bubble ' + type;
      div.innerHTML = html;
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
      return div;
    }

    function chatAddTyping() {
      const msgs = document.getElementById('chat-messages');
      const id = 'typing-' + Date.now();
      const div = document.createElement('div');
      div.className = 'chat-typing';
      div.id = id;
      div.innerHTML = '<div class="chat-dot"></div><div class="chat-dot"></div><div class="chat-dot"></div>';
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
      return id;
    }

    function chatRemoveTyping(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    function escHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function chatKeyDown(e) {
      // Send on Enter (not Shift+Enter)
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); chatSend(); }
    }

    function chatAutoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 80) + 'px';
    }
  </script>
</body>

</html>
